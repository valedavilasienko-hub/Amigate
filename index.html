<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Amigate</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <link rel="stylesheet" href="styles.css">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="header">

  <a href="#" class="logo">
    Amigate
  </a>

  <div class="header-actions">

    <button class="btn-login">
      Iniciar sesión
    </button>

    <button class="btn-seller">
      Publicar mi marca
    </button>

  </div>

</header>


<main>

  <section class="hero">

    <div class="hero-content">

      <span class="hero-tag">
        HECHO EN ARGENTINA
      </span>

      <h1>
        Argentina tiene<br>
        lo que buscás.
      </h1>

      <p>
        Descubrí marcas, productos, servicios,
        profesionales y oportunidades disponibles
        en tu provincia.
      </p>

      <div class="search-box">

        <input
          type="search"
          placeholder="¿Qué estás buscando?"
        >

        <button>
          Buscar
        </button>

      </div>

    </div>

  </section>


  <section class="map-section">

    <div class="map-header">

      <span class="section-label">
        EXPLORÁ ARGENTINA
      </span>

      <h2>
        Elegí tu provincia
      </h2>

      <p>
        Tocá una provincia para comenzar.
      </p>

    </div>


    <div class="map-container">

      <div id="argentinaMap"></div>

      <div
        id="mapLoading"
        class="map-loading"
      >
        Cargando mapa...
      </div>

    </div>


    <div
      id="selectedPanel"
      class="selected-panel hidden"
    >

      <div>
        <small>
          Provincia seleccionada
        </small>

        <strong id="selectedProvinceName"></strong>
      </div>

      <button id="exploreButton">
        Explorar
      </button>

    </div>

  </section>

</main>


<script src="supabase.js"></script>
<script src="app.js"></script>

</body>
</html>
