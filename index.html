<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Amigate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    :root{
      --orange:#EB6841;
      --orange-dark:#D9542F;
      --orange-soft:#F2B8A3;
      --orange-hover:#F08B65;

      --cream:#FFF8F2;
      --cream-soft:#FFF2E9;

      --dark:#221E1C;
      --gray:#746B66;

      --white:#FFFFFF;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html,
    body{
      width:100%;
      height:100%;
    }

    body{
      font-family:"DM Sans",sans-serif;
      background:var(--cream);
      color:var(--dark);
      overflow:hidden;
    }

    button{
      font:inherit;
    }

    /* ============================
       PÁGINA
    ============================ */

    .page{
      width:100%;
      height:100vh;

      display:grid;
      grid-template-columns:46% 54%;

      background:
        radial-gradient(
          circle at 80% 45%,
          rgba(235,104,65,.11),
          transparent 34%
        ),
        var(--cream);
    }


    /* ============================
       IZQUIERDA
    ============================ */

    .left{
      padding:40px 4vw 40px 5vw;

      display:flex;
      flex-direction:column;

      position:relative;
      z-index:10;
    }

    .logo{
      color:var(--orange);

      font-size:34px;
      font-weight:800;

      letter-spacing:-1.8px;
    }

    .hero{
      flex:1;

      display:flex;
      flex-direction:column;
      justify-content:center;

      max-width:720px;
    }

    .eyebrow{
      margin-bottom:20px;

      color:var(--orange);

      font-size:12px;
      font-weight:800;

      letter-spacing:.15em;
      text-transform:uppercase;
    }

    h1{
      font-family:"Playfair Display",serif;

      font-size:clamp(56px,5.5vw,94px);

      line-height:.95;

      letter-spacing:-.055em;

      font-weight:600;
    }

    h1 span{
      color:var(--orange);
    }

    .line{
      width:72px;
      height:4px;

      margin:28px 0 24px;

      background:var(--orange);

      border-radius:99px;
    }

    .description{
      max-width:610px;

      color:var(--gray);

      font-size:18px;

      line-height:1.55;
    }

    .actions{
      display:flex;

      gap:12px;

      margin-top:32px;
    }

    .btn{
      min-height:56px;

      padding:0 23px;

      border-radius:15px;

      border:none;

      cursor:pointer;

      font-weight:700;

      transition:.2s ease;
    }

    .btn-main{
      color:white;

      background:var(--orange);

      box-shadow:
        0 16px 35px rgba(235,104,65,.20);
    }

    .btn-main:hover{
      transform:translateY(-2px);

      background:var(--orange-dark);
    }

    .btn-light{
      color:var(--dark);

      background:rgba(255,255,255,.6);

      border:1px solid rgba(235,104,65,.22);
    }


    /* ============================
       MAPA
    ============================ */

    .right{
      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;
    }

    .map-area{
      width:100%;
      height:100%;

      position:relative;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    #argentinaMap{
      height:min(91vh,900px);
      width:auto;

      overflow:visible;

      filter:
        drop-shadow(
          0 28px 35px
          rgba(100,50,30,.08)
        );
    }

    .province{
      fill:var(--orange-soft);

      stroke:var(--cream);

      stroke-width:4;

      cursor:pointer;

      transform-box:fill-box;
      transform-origin:center;

      transition:
        fill .18s ease,
        transform .18s ease,
        opacity .18s ease,
        filter .18s ease;
    }

    .province:hover{
      fill:var(--orange-hover);

      transform:scale(1.035);

      filter:
        drop-shadow(
          0 6px 7px
          rgba(100,40,20,.18)
        );
    }

    #argentinaMap.has-selection
    .province:not(.selected){
      opacity:.45;
    }

    .province.selected{
      fill:var(--orange);

      opacity:1 !important;

      transform:scale(1.045);

      filter:
        drop-shadow(
          0 8px 10px
          rgba(100,40,20,.23)
        );
    }


    /* ============================
       TEXTO DE PROVINCIA
    ============================ */

    .province-info{
      position:absolute;

      right:3vw;
      bottom:7vh;

      width:245px;

      padding:18px;

      border-radius:18px;

      background:
        rgba(255,255,255,.88);

      backdrop-filter:blur(12px);

      box-shadow:
        0 18px 45px
        rgba(65,30,15,.10);

      opacity:0;

      transform:
        translateY(12px);

      pointer-events:none;

      transition:.22s ease;
    }

    .province-info.visible{
      opacity:1;

      transform:
        translateY(0);

      pointer-events:auto;
    }

    .province-info small{
      display:block;

      margin-bottom:5px;

      color:var(--gray);

      font-size:11px;
      font-weight:700;

      text-transform:uppercase;

      letter-spacing:.09em;
    }

    .province-info strong{
      display:block;

      font-family:"Playfair Display",serif;

      font-size:27px;

      line-height:1.1;
    }

    .province-info button{
      width:100%;

      margin-top:14px;

      padding:13px;

      border:0;

      border-radius:12px;

      color:white;

      background:var(--orange);

      font-weight:800;

      cursor:pointer;
    }

    .province-info button:hover{
      background:var(--orange-dark);
    }


    /* ============================
       TOOLTIP
    ============================ */

    .tooltip{
      position:fixed;

      z-index:999;

      padding:8px 12px;

      background:var(--dark);

      color:white;

      border-radius:9px;

      font-size:13px;
      font-weight:700;

      pointer-events:none;

      opacity:0;

      transform:
        translate(-50%,-120%);

      transition:opacity .12s;
    }

    .tooltip.visible{
      opacity:1;
    }


    /* ============================
       MOBILE
    ============================ */

    @media(max-width:900px){

      body{
        overflow:auto;
      }

      .page{
        height:auto;
        min-height:100vh;

        grid-template-columns:1fr;
      }

      .left{
        min-height:52vh;

        padding:
          28px 22px
          20px;
      }

      .hero{
        padding-top:50px;
      }

      h1{
        font-size:
          clamp(50px,13vw,75px);
      }

      .description{
        font-size:16px;
      }

      .actions{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }

      .right{
        min-height:720px;
      }

      #argentinaMap{
        width:86vw;
        height:auto;

        max-height:650px;
      }

      .province-info{
        width:
          calc(100% - 34px);

        left:17px;
        right:auto;

        bottom:18px;
      }

    }


    @media(max-width:520px){

      .logo{
        font-size:29px;
      }

      .hero{
        padding-top:40px;
      }

      h1{
        font-size:50px;
      }

      .right{
        min-height:650px;
      }

      #argentinaMap{
        width:92vw;
      }

    }

  </style>
</head>

<script>

  const map =
    document.getElementById(
      "argentinaMap"
    );

  const provinces =
    document.querySelectorAll(
      ".province"
    );

  const info =
    document.getElementById(
      "provinceInfo"
    );

  const provinceName =
    document.getElementById(
      "provinceName"
    );

  const exploreButton =
    document.getElementById(
      "exploreProvince"
    );

  const tooltip =
    document.getElementById(
      "tooltip"
    );

  let selected = null;


  function selectProvince(path){

    provinces.forEach(
      province =>
        province.classList.remove(
          "selected"
        )
    );

    path.classList.add(
      "selected"
    );

    map.classList.add(
      "has-selection"
    );

    selected = {
      name:
        path.dataset.name,

      slug:
        path.dataset.slug
    };

    provinceName.textContent =
      selected.name;

    exploreButton.textContent =
      "Explorar " +
      selected.name;

    info.classList.add(
      "visible"
    );

    localStorage.setItem(
      "amigate_province",
      JSON.stringify(selected)
    );

  }


  provinces.forEach(
    province => {

      province.addEventListener(
        "mouseenter",
        () => {

          tooltip.textContent =
            province.dataset.name;

          tooltip.classList.add(
            "visible"
          );

        }
      );


      province.addEventListener(
        "mousemove",
        event => {

          tooltip.style.left =
            event.clientX + "px";

          tooltip.style.top =
            event.clientY + "px";

        }
      );


      province.addEventListener(
        "mouseleave",
        () => {

          tooltip.classList.remove(
            "visible"
          );

        }
      );


      province.addEventListener(
        "click",
        () => {

          selectProvince(
            province
          );

        }
      );

    }
  );


  exploreButton.addEventListener(
    "click",
    () => {

      if(!selected){
        return;
      }

      /*
        EN EL PRÓXIMO PASO:
        esto va a abrir la pantalla
        de categorías correspondiente
        a la provincia elegida.
      */

      alert(
        "Explorando " +
        selected.name
      );

    }
  );


  /* RESTAURAR SELECCIÓN */

  const stored =
    localStorage.getItem(
      "amigate_province"
    );

  if(stored){

    try{

      const saved =
        JSON.parse(stored);

      const path =
        document.querySelector(
          `[data-slug="${saved.slug}"]`
        );

      if(path){

        selectProvince(
          path
        );

      }

    }
    catch(error){

      localStorage.removeItem(
        "amigate_province"
      );

    }

  }


  document
    .getElementById(
      "sellerButton"
    )
    .addEventListener(
      "click",
      () => {

        alert(
          "Próximo paso: Publicar mi marca"
        );

      }
    );


  document
    .getElementById(
      "loginButton"
    )
    .addEventListener(
      "click",
      () => {

        alert(
          "Próximo paso: Iniciar sesión"
        );

      }
    );

</script>
