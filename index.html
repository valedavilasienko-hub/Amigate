<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amigate</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root{
      --orange:#ea6a45;
      --orange-dark:#d65734;
      --orange-soft:#f3b9a3;
      --orange-hover:#f08b64;
      --cream:#fff8f2;
      --cream-2:#fff3ea;
      --dark:#221e1c;
      --gray:#746b66;
      --white:#ffffff;
      --line:#f7ede7;
    }

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    html, body{
      width:100%;
      height:100%;
    }

    body{
      font-family:"DM Sans",sans-serif;
      background:var(--cream);
      color:var(--dark);
      overflow:hidden;
    }

    button{
      font:inherit;
    }

    .page{
      width:100%;
      height:100vh;
      display:grid;
      grid-template-columns:46% 54%;
      background:
        radial-gradient(circle at 82% 44%, rgba(234,106,69,.11), transparent 30%),
        radial-gradient(circle at 18% 78%, rgba(234,106,69,.07), transparent 25%),
        var(--cream);
    }

    /* =====================
       IZQUIERDA
    ===================== */

    .left{
      padding:40px 4vw 40px 5vw;
      display:flex;
      flex-direction:column;
      position:relative;
      z-index:10;
    }

    .logo{
      color:var(--orange);
      font-size:34px;
      font-weight:800;
      letter-spacing:-1.8px;
    }

    .hero{
      flex:1;
      display:flex;
      flex-direction:column;
      justify-content:center;
      max-width:730px;
    }

    .eyebrow{
      margin-bottom:20px;
      color:var(--orange);
      font-size:12px;
      font-weight:800;
      letter-spacing:.15em;
      text-transform:uppercase;
    }

    h1{
      font-family:"Playfair Display",serif;
      font-size:clamp(56px,5.5vw,94px);
      line-height:.95;
      letter-spacing:-.055em;
      font-weight:600;
    }

    h1 span{
      color:var(--orange);
    }

    .line{
      width:72px;
      height:4px;
      margin:28px 0 24px;
      background:var(--orange);
      border-radius:999px;
    }

    .description{
      max-width:620px;
      color:var(--gray);
      font-size:18px;
      line-height:1.55;
    }

    .actions{
      display:flex;
      gap:12px;
      margin-top:32px;
    }

    .btn{
      min-height:56px;
      padding:0 23px;
      border-radius:15px;
      border:none;
      cursor:pointer;
      font-weight:700;
      transition:.2s ease;
    }

    .btn-main{
      color:white;
      background:var(--orange);
      box-shadow:0 16px 35px rgba(234,106,69,.20);
    }

    .btn-main:hover{
      transform:translateY(-2px);
      background:var(--orange-dark);
    }

    .btn-light{
      color:var(--dark);
      background:rgba(255,255,255,.68);
      border:1px solid rgba(234,106,69,.20);
    }

    .btn-light:hover{
      background:white;
    }

    /* =====================
       DERECHA
    ===================== */

    .right{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .map-area{
      width:100%;
      height:100%;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .map-glow{
      position:absolute;
      width:540px;
      height:540px;
      border-radius:50%;
      background:
        radial-gradient(circle, rgba(234,106,69,.12), rgba(234,106,69,.02) 60%, transparent 76%);
      filter:blur(6px);
    }

    #argentinaMap{
      width:min(530px, 74%);
      height:auto;
      overflow:visible;
      filter:drop-shadow(0 28px 34px rgba(110,55,30,.07));
      position:relative;
      z-index:2;
    }

    .province{
      fill:var(--orange-soft);
      stroke:var(--line);
      stroke-width:2.4;
      cursor:pointer;
      transition:
        fill .18s ease,
        transform .18s ease,
        opacity .18s ease,
        filter .18s ease;
      transform-box:fill-box;
      transform-origin:center;
    }

    .province:hover{
      fill:var(--orange-hover);
      transform:scale(1.03);
      filter:drop-shadow(0 6px 8px rgba(90,45,25,.18));
    }

    #argentinaMap.has-selection .province:not(.selected){
      opacity:.38;
    }

    .province.selected{
      fill:var(--orange);
      opacity:1 !important;
      transform:scale(1.04);
      filter:drop-shadow(0 7px 10px rgba(90,45,25,.22));
    }

    .country-outline{
      fill:none;
      stroke:#e3cec3;
      stroke-width:2.2;
      pointer-events:none;
      opacity:.9;
    }

    .province-info{
      position:absolute;
      right:3vw;
      bottom:7vh;
      width:255px;
      padding:18px;
      border-radius:18px;
      background:rgba(255,255,255,.92);
      backdrop-filter:blur(12px);
      box-shadow:0 18px 45px rgba(65,30,15,.10);
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
      transition:.22s ease;
      z-index:5;
    }

    .province-info.visible{
      opacity:1;
      transform:translateY(0);
      pointer-events:auto;
    }

    .province-info small{
      display:block;
      margin-bottom:5px;
      color:var(--gray);
      font-size:11px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.09em;
    }

    .province-info strong{
      display:block;
      font-family:"Playfair Display",serif;
      font-size:27px;
      line-height:1.1;
    }

    .province-info button{
      width:100%;
      margin-top:14px;
      padding:13px;
      border:0;
      border-radius:12px;
      color:white;
      background:var(--orange);
      font-weight:800;
      cursor:pointer;
    }

    .province-info button:hover{
      background:var(--orange-dark);
    }

    .tooltip{
      position:fixed;
      z-index:999;
      padding:8px 12px;
      background:var(--dark);
      color:white;
      border-radius:9px;
      font-size:13px;
      font-weight:700;
      pointer-events:none;
      opacity:0;
      transform:translate(-50%,-120%);
      transition:opacity .12s;
    }

    .tooltip.visible{
      opacity:1;
    }

    /* =====================
       MOBILE
    ===================== */

    @media(max-width:900px){
      body{
        overflow:auto;
      }

      .page{
        height:auto;
        min-height:100vh;
        grid-template-columns:1fr;
      }

      .left{
        min-height:50vh;
        padding:28px 22px 20px;
      }

      .hero{
        padding-top:48px;
      }

      h1{
        font-size:clamp(50px,13vw,74px);
      }

      .description{
        font-size:16px;
      }

      .actions{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }

      .right{
        min-height:760px;
      }

      #argentinaMap{
        width:min(420px, 88vw);
      }

      .province-info{
        width:calc(100% - 34px);
        left:17px;
        right:auto;
        bottom:18px;
      }
    }

    @media(max-width:520px){
      .logo{
        font-size:29px;
      }

      h1{
        font-size:50px;
      }

      .right{
        min-height:680px;
      }

      #argentinaMap{
        width:min(390px, 92vw);
      }
    }
  </style>
</head>

<div class="tooltip" id="tooltip"></div>

<script>
  const map = document.getElementById("argentinaMap");
  const mapArea = document.getElementById("mapArea");
  const provinces = document.querySelectorAll(".province");
  const info = document.getElementById("provinceInfo");
  const provinceName = document.getElementById("provinceName");
  const exploreButton = document.getElementById("exploreProvince");
  const tooltip = document.getElementById("tooltip");

  let selected = null;

  function clearSelection(){
    provinces.forEach(province => {
      province.classList.remove("selected");
    });

    map.classList.remove("has-selection");
    info.classList.remove("visible");
    selected = null;
    localStorage.removeItem("amigate_province");
  }

  function selectProvince(path){
    const alreadySelected = path.classList.contains("selected");

    if(alreadySelected){
      clearSelection();
      return;
    }

    provinces.forEach(province => {
      province.classList.remove("selected");
    });

    path.classList.add("selected");
    map.classList.add("has-selection");

    selected = {
      name: path.dataset.name,
      slug: path.dataset.slug
    };

    provinceName.textContent = selected.name;
    exploreButton.textContent = "Explorar " + selected.name;
    info.classList.add("visible");

    localStorage.setItem(
      "amigate_province",
      JSON.stringify(selected)
    );
  }

  provinces.forEach(province => {
    province.addEventListener("mouseenter", () => {
      tooltip.textContent = province.dataset.name;
      tooltip.classList.add("visible");
    });

    province.addEventListener("mousemove", event => {
      tooltip.style.left = event.clientX + "px";
      tooltip.style.top = event.clientY + "px";
    });

    province.addEventListener("mouseleave", () => {
      tooltip.classList.remove("visible");
    });

    province.addEventListener("click", event => {
      event.stopPropagation();
      selectProvince(province);
    });
  });

  info.addEventListener("click", event => {
    event.stopPropagation();
  });

  mapArea.addEventListener("click", event => {
    if(event.target.classList.contains("province")){
      return;
    }

    if(selected){
      clearSelection();
    }
  });

  exploreButton.addEventListener("click", () => {
    if(!selected) return;

    alert("Explorando " + selected.name);
  });

  const stored = localStorage.getItem("amigate_province");

  if(stored){
    try{
      const saved = JSON.parse(stored);
      const path = document.querySelector(`[data-slug="${saved.slug}"]`);

      if(path){
        selectProvince(path);
      }
    }catch(error){
      localStorage.removeItem("amigate_province");
    }
  }

  document.getElementById("sellerButton").addEventListener("click", () => {
    alert("Próximo paso: registro de marcas");
  });

  document.getElementById("loginButton").addEventListener("click", () => {
    alert("Próximo paso: iniciar sesión");
  });
</script>
